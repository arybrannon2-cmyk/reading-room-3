</style></head><body>
<div id="view"></div><header class="head"><div><h1>READING ROOM</h1><div class="subtitle">Your Goodreads collection · v1.3</div></div><div class="tag">232 BOOKS</div></header><div class="hint">Drag to pan · Pinch to zoom · ↶/↷ to orbit</div><nav class="panel"><button id="left">↶</button><button id="zoomout">−</button><button id="fit">Fit</button><button id="zoomin">+</button><button id="right">↷</button></nav><aside id="card" class="card"><h2 id="title"></h2><p id="bookmeta"></p><img id="selectedcover" alt="Book cover" style="display:none;max-height:190px;max-width:130px;object-fit:contain;margin:8px 0;border-radius:3px"><p>Cover images are looked up by edition ISBN from Open Library. Missing or mismatched artwork may still require review.</p><button class="dismiss" id="dismiss">Close</button></aside><div id="error" class="error"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
const view=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color('#130e0c');scene.fog=new THREE.Fog('#130e0c',22,40);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;view.appendChild(renderer.domElement);
const ambient=new THREE.HemisphereLight(0xffd9b6,0x1d110a,1.25);scene.add(ambient);
const key=new THREE.DirectionalLight(0xffe0b5,2.0);key.position.set(-4,6,8);scene.add(key);
const fill=new THREE.PointLight(0xffc48a,16,13,2);fill.position.set(3,3,5);scene.add(fill);
const sceneRoot=new THREE.Group();scene.add(sceneRoot);
const wood=new THREE.MeshStandardMaterial({color:0x3a2518,roughness:.86,metalness:.03}),woodLight=new THREE.MeshStandardMaterial({color:0x5a3924,roughness:.78}),woodDark=new THREE.MeshStandardMaterial({color:0x24150f,roughness:.9});
const brass=new THREE.MeshStandardMaterial({color:0xa57b42,metalness:.7,roughness:.31}),page=new THREE.MeshStandardMaterial({color:0xd9ceb1,roughness:.93});
const boxGeometry=new THREE.BoxGeometry(1,1,1);
function box(parent,w,h,d,x,y,z,material){const mesh=new THREE.Mesh(boxGeometry,material);mesh.scale.set(w,h,d);mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function textureWood(){const c=document.createElement('canvas');c.width=256;c.height=1024;const g=c.getContext('2d');g.fillStyle='#4a2a19';g.fillRect(0,0,256,1024);let seed=123456;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let j=0;j<500;j++){const x=rnd()*256;g.strokeStyle=rnd()>.45?'rgba(12,5,2,.10)':'rgba(228,167,97,.10)';g.lineWidth=.25+rnd()*2;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+12*rnd(),220,x-13*rnd(),690,x+8*rnd(),1024);g.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
wood.map=textureWood();wood.needsUpdate=true;
const cabinet=new THREE.Group();sceneRoot.add(cabinet);
const libraryBooks=await fetch('./books.json').then(r=>{if(!r.ok)throw Error('Book database missing');return r.json()}).then(j=>j.books);
const W=6.8,H=28.35,D=1.36;
box(cabinet,W+.55,.31,D+.22,0,H/2+.1,0,woodLight);box(cabinet,W+.37,.18,D+.17,0,H/2+.32,.02,woodDark);
box(cabinet,W+.5,.35,D+.24,0,-H/2-.13,0,woodLight);box(cabinet,W+.28,.27,D+.16,0,-H/2-.41,.06,woodDark);
for(let x of [-W/2,W/2]){box(cabinet,.31,H,D+.16,x,0,0,wood);box(cabinet,.11,H,.11,x,0,D/2+.15,woodLight)}
box(cabinet,W-.19,H-.12,.12,0,0,-D/2+.04,woodDark);
const levels=Array.from({length:13},(_,i)=>-H/2+.34+i*2.12);const bayCenters=levels.map(y=>y+.98);
for(const y of levels){box(cabinet,W,.24,D+.1,0,y,0,woodLight);box(cabinet,W,.085,.12,0,y+.12,D/2+.1,brass);box(cabinet,W-.32,.02,D-.2,0,y+.13,0,wood)}
const topShelf=H/2-.12;box(cabinet,W,.19,D,0,topShelf,0,wood);
for(const y of bayCenters){const light=new THREE.PointLight(0xffb96d,1.65,3.6,2);light.position.set(0,y,.14);cabinet.add(light);box(cabinet,W-.76,.018,.045,0,y+.05,.25,new THREE.MeshBasicMaterial({color:0xc79055}));}
for(let x of [-W/2+.23,W/2-.23]){box(cabinet,.19,H,.19,x,0,D/2+.13,woodLight);box(cabinet,.035,H,.045,x+(x<0?.08:-.08),0,D/2+.235,brass)}
// Inset interior side panels give the cabinet deep, visible side walls.
for(let x of [-W/2+.18,W/2-.18])box(cabinet,.12,H-.18,D-.19,x,0,-.07,woodDark);
// Layered carved top and a continuous plinth.
box(cabinet,W+.75,.12,D+.4,0,H/2+.48,.02,woodLight);
box(cabinet,W+.63,.085,D+.3,0,H/2+.59,.01,brass);
box(cabinet,W+.72,.14,D+.36,0,-H/2-.62,.02,woodLight);
box(cabinet,W+.40,.12,D+.23,0,-H/2-.75,.08,woodDark);
function makeLabel(text,fontSize=78){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');g.clearRect(0,0,512,256);g.fillStyle='#ead9ad';g.textAlign='center';g.textBaseline='middle';g.font='bold '+fontSize+'px Georgia';const words=text.split(' ');let lines=[''];for(const word of words){if((lines[lines.length-1]+' '+word).length>16)lines.push(word);else lines[lines.length-1]+=' '+word}lines.slice(0,4).forEach((l,i)=>g.fillText(l.trim(),256,128+(i-(Math.min(lines.length,4)-1)/2)*66,468));const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false})}
const titles=libraryBooks.map(b=>b.title);
const colors=[0x274c45,0x344b3a,0x53452c,0x582a30,0x273d58,0x503952,0x775039,0x31525a,0x594b35,0x49352b,0x684434,0x676048];
const clickables=[];let index=0;
const spineText=(title,w,h)=>{const material=makeLabel(title,45);const plane=new THREE.Mesh(new THREE.PlaneGeometry(w*.96,h*.73),material);plane.rotation.z=Math.PI/2;return plane};
for(let row=0;row<levels.length;row++){let x=-W/2+.33;const bottom=levels[row]+.15;let count=0;while(x<W/2-.48 && index<libraryBooks.length){const feature=(count%12===5);const width=feature?.84:.16+((index*7)%13)/100;const height=feature?1.62:1.34+((index*11)%45)/100;const depth=.38+((index*3)%21)/100; if(x+width>W/2-.24)break;const group=new THREE.Group();const book=libraryBooks[index];const title=book.title;group.userData={title,book};group.position.set(x+width/2,bottom+height/2,.19+((index%5)*.055));group.rotation.z=feature?0:(index%11===0?-.04:index%13===0?.04:0);cabinet.add(group);const cover=new THREE.MeshStandardMaterial({color:colors[index%colors.length],roughness:.62,metalness:.05});box(group,width,height,depth,0,0,0,cover);box(group,width*.83,height*.955,depth*.85,.01,0,-.005,page);
box(group,width*.96,height*.99,depth*.13,-.007,0,depth*.43,cover);
if(feature){const face=new THREE.Mesh(new THREE.PlaneGeometry(width*.85,height*.82),makeLabel(title,55));face.position.z=depth/2+.027;group.add(face);if(book.isbn13||book.isbn10){const isbn=book.isbn13||book.isbn10;new THREE.TextureLoader().load('https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(isbn)+'-M.jpg?default=false',tex=>{tex.colorSpace=THREE.SRGBColorSpace;const img=new THREE.Mesh(new THREE.PlaneGeometry(width*.86,height*.82),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));img.position.z=depth/2+.035;group.add(img);render()},undefined,()=>{});}box(group,width*.84,.012,.02,0,-height*.39,depth/2+.03,brass);box(group,width*.84,.012,.02,0,height*.39,depth/2+.03,brass)}
else{const spine=spineText(title,width,height);spine.position.set(0,0,depth/2+.03);group.add(spine);box(group,width*.78,.012,.015,0,height*.39,depth/2+.024,brass);box(group,width*.78,.012,.015,0,-height*.39,depth/2+.024,brass)}
group.traverse(o=>{if(o.isMesh)o.userData.book=group});clickables.push(group);x+=width+.035;index++;count++}}
const sphereGeo=new THREE.SphereGeometry(.1,18,12);const ornament=new THREE.Group();ornament.position.set(W/2-.7,levels[2]+.16,.26);cabinet.add(ornament);box(ornament,.48,.13,.48,0,0,0,brass);const bust=new THREE.Mesh(sphereGeo,brass);bust.scale.set(1,1.8,1);bust.position.y=.25;ornament.add(bust);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x1c130f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-H/2-.47;scene.add(floor);
let azimuth=-.10,elevation=.01,dist=58;const target=new THREE.Vector3(0,0,0),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null,gesture=null;const active=new Map();
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function render(){camera.position.set(target.x+dist*Math.sin(azimuth)*Math.cos(elevation),target.y+dist*Math.sin(elevation),target.z+dist*Math.cos(azimuth)*Math.cos(elevation));camera.lookAt(target);renderer.render(scene,camera)}
function fit(){const ar=innerWidth/innerHeight;dist=ar<.7?59:46;azimuth=-.10;elevation=.055;target.set(0,0,0);render()}
function zoom(n){dist=clamp(dist*n,7,95);render()}
document.getElementById('left').onclick=()=>{azimuth=clamp(azimuth-.2,-.9,.9);render()};document.getElementById('right').onclick=()=>{azimuth=clamp(azimuth+.2,-.9,.9);render()};document.getElementById('fit').onclick=fit;document.getElementById('zoomin').onclick=()=>zoom(.85);document.getElementById('zoomout').onclick=()=>zoom(1.17);
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===1)down={x:e.clientX,y:e.clientY,dragged:false};else down=null});
view.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const prev=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...active.values()];if(p.length===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.dragged=true;const visibleHeight=2*dist*Math.tan(THREE.MathUtils.degToRad(18));target.x=clamp(target.x-dx/innerHeight*visibleHeight,-W/2+1,W/2-1);target.y=clamp(target.y+dy/innerHeight*visibleHeight,-H/2+1,H/2-1);render()}else if(p.length===2){const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(gesture)zoom(gesture/d);gesture=d}});
view.addEventListener('pointerup',e=>{active.delete(e.pointerId);gesture=null;if(down&&!down.dragged){const rect=view.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const objects=[];for(const g of clickables)g.traverse(o=>{if(o.isMesh)objects.push(o)});const hit=raycaster.intersectObjects(objects,false)[0];if(hit&&hit.object.userData.book){const book=hit.object.userData.book.userData.book;document.getElementById('title').textContent=book.title;document.getElementById('bookmeta').textContent=book.author+' · '+(book.shelf||'Library');const img=document.getElementById('selectedcover');img.style.display='none';img.removeAttribute('src');if(book.isbn13||book.isbn10){img.src='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(book.isbn13||book.isbn10)+'-L.jpg?default=false';img.onload=()=>img.style.display='block';img.onerror=()=>img.style.display='none'}document.getElementById('card').classList.add('show')}}down=null});
view.addEventListener('pointercancel',e=>{active.delete(e.pointerId);gesture=null;down=null});
view.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0015))},{passive:false});document.getElementById('dismiss').onclick=()=>document.getElementById('card').classList.remove('show');
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render()}window.addEventListener('resize',resize);fit();
</script><script>setTimeout(()=>{if(!document.querySelector('canvas')){const e=document.getElementById('error');e.style.display='block';e.textContent='3D library could not load. Check your network connection and refresh.'}},7000)</script></body></html>
